[package]
name = "luautf8-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "luautf8"
crate-type = ["lib", "cdylib"]

[features]
default = ["std"]
std = ["unicode-normalization/std"]
module = ["mlua/module"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
luajit = ["mlua/luajit"]

[dependencies]
mlua = { version = "0.12", features = [] }
unicode-normalization = { version = "0.1.25", default-features = false }
